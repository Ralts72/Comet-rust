[package]
name = "comet-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
comet-asset-data = { path = "../asset/data" }
comet-core = { path = "../core" }
comet-scene = { path = "../scene" }
anyhow.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = { version = "0.6", features = ["std"] }
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out"] }
png.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSObject"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLTypes", "objc2-core-foundation", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLBlitCommandEncoder", "MTLRenderCommandEncoder", "MTLLibrary", "MTLBuffer", "MTLResource", "MTLTexture", "MTLPixelFormat", "MTLArgument", "MTLStageInputOutputDescriptor", "MTLRenderPass", "MTLRenderPipeline", "MTLVertexDescriptor", "MTLDepthStencil", "MTLDrawable", "MTLSampler"] }
objc2-quartz-core = { version = "0.3.2", features = ["CAMetalLayer"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
raw-window-metal = "1.1"
[target.'cfg(not(target_os = "macos"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "loaded", "debug"] }
ash-window = "0.13"
