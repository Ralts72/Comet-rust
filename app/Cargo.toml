[package]
name = "comet-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "../tools/launch/build.rs"
[dependencies]
comet-asset-data = { path = "../engine/asset/data" }
comet-core = { path = "../engine/core" }
comet-scene = { path = "../engine/scene" }
comet-asset = { path = "../engine/asset/runtime" }
comet-runtime = { path = "../engine/runtime" }
comet-application = { path = "../engine/application" }
anyhow.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSPathUtilities", "NSURL", "NSArray"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
