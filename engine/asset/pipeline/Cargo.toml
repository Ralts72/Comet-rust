[package]
name = "comet-asset-pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
comet-asset-data = { path = "../data" }
comet-core = { path = "../../core" }
comet-scene = { path = "../../scene" }
comet-asset = { path = "../runtime" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
base64 = "0.22"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
[dev-dependencies]
comet-editor-core = { path = "../../../editor/core" }
tempfile = "3"
