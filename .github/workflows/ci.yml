name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Linux tests / Windows check / Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Install repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install Linux audio SDK
        run: |
          # The runner's regional mirror can fail DNS resolution.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y pkg-config libasound2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      - name: Verify workspace and standalone package
        run: python3 tools/verify/verify.py --windows

      - name: Build Release asset tool
        run: |
          mkdir -p target/verification
          cargo build --release --locked -p comet-assetc 2>&1 | tee target/verification/release-build.log

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-linux
          path: |
            target/verification/*.log
            target/verification/*.json
            target/verification/dependencies/*.json
          retention-days: 7
          if-no-files-found: ignore
